<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft For Dummies Bot</title>

<link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Minecraftia', sans-serif;
    font-size: 18px;
    text-shadow: 2px 2px 0px #3f3f3f;
}

body {
    background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                      url("{{ url_for('static', filename='image/background.jpg') }}");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* CONTAINER */
.chat-container {
    width: 100%;
    max-width: 1180px;
    height: 70vh;
    background-image: url("{{ url_for('static', filename='image/chat_bg.jpg') }}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    border-radius: 0px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 4px solid #1e1e1e;
    box-shadow: 8px 8px 0px rgba(0,0,0,0.3);
}

.main-logo {
    width: 100%;
    max-width: 1250px;
    image-rendering: pixelated;
    margin-bottom: 20px;
}

/* QUICK BUTTONS */
.quick-buttons {
    display: flex;
    justify-content: center;
    gap: 50px;
    flex-wrap: wrap;
    width: 100%;
    max-width: 1250px;
    margin-bottom: 15px;
    background: transparent; 
    border-bottom: none;
    padding: 0;
}

.quick-btn {
    background-color: #848484;
    color: #ffffff;
    padding: 8px 14px;
    border-radius: 0px;
    cursor: pointer;
    font-size: 0.95rem;
    border: 3px solid;
    border-color: #ffffff #555555 #555555 #ffffff; 
    outline: 2px solid #000000;
    margin: 2px;
}

.quick-btn:hover {
    background-color: #727272;
    color: #ffff55;
}

.quick-btn:active {
    background-color: #6a6a6a;
    border-color: #555555 #ffffff #ffffff #555555; 
}

/* CHAT AREA */
.messages-area {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    background: transparent;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-bottom: none;
}

/* MESSAGES */
.message {
    padding: 4px 8px;
    background-color: rgba(0, 0, 0, 0.7);
    border: none !important;
    box-shadow: none !important;
    font-size: 0.9rem;
    line-height: 1.6;
    color: #ffffff;
    display: flex;
    align-items: flex-start;
    max-width: 90%;
}

.message div {
    flex: 1;
}

.user-message {
    align-self: flex-end;
}

.assistant-message {
    align-self: flex-start;
}

.assistant-message p {
    margin-bottom: 12px;
    line-height: 1.5;
}

.assistant-message p:last-child {
    margin-bottom: 0;
}

.assistant-message strong {
    font-weight: 700;
}

.assistant-message h3 {
    font-size: 1rem; 
    font-weight: 700;
    margin-top: 16px;
    margin-bottom: 8px;
}

.assistant-message ul, .assistant-message ol {
    margin-left: 24px;
    margin-bottom: 12px;
    margin-top: 4px;
}

.assistant-message li {
    margin-bottom: 6px;
    line-height: 1.4;
}

/* INPUT */
.input-area {
    display: flex;
    align-items: center;
    padding: 10px 18px;
    background-color: rgba(0, 0, 0, 0.8);
    gap: 10px;
}

.input-area input {
    flex: 1;
    background: transparent;
    color: #ffffff;
    border: none;
    outline: none;
    font-size: 0.9rem;
}

.prompt-prefix {
    color: #ffffff;
    font-size: 1rem;
    font-weight: bold;
}

/* LOADING */
.loading-indicator {
    display: none;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 10px;
    color: white;
}

/* AVATARES DE CHAT */
.chat-avatar {
    width: 32px;
    height: 32px;
    image-rendering: pixelated;
    border: 2px solid;
    margin-bottom: -6px;
    transform: translateY(-3px);
}

.user-message .chat-avatar {
    margin-left: 10px;
    border: none;
}


.assistant-message .chat-avatar {
    margin-right: 10px;
    border: 2px solid #55ffff;
}

</style>

</head>

<body>

    <!-- HEADER -->
    <img src="{{ url_for('static', filename='image/logo_titulo.png') }}" class="main-logo" alt="Asistente de Supervivencia">

    <!-- QUICK PROMPTS -->
    <div class="quick-buttons">
        <button class="quick-btn" data-q="Guía desde el día 1 hasta la Enderdragón">📜 Guía completa</button>
        <button class="quick-btn" data-q="Cómo hacer pico de piedra y mesa de crafteo">🛠️ Crafteos</button>
        <button class="quick-btn" data-q="Estoy en el Nether sin fortaleza">🔥 Nether</button>
        <button class="quick-btn" data-q="Cómo matar enderman fácilmente">👾 Mobs</button>
        <button class="quick-btn" data-q="Dónde encontrar diamantes rápido">💎 Diamantes</button>
    </div>

    <!-- CHAT -->
    <div class="chat-container">

    <div class="messages-area" id="messagesArea">

        <div class="message assistant-message">
            🧙 ¡Hola aventurero! Soy tu guía definitivo de Minecraft. Pregúntame sobre mobs, biomas, crafteos, o cuéntame cualquier situación que estés viviendo en el juego. ¡Te ayudaré paso a paso hasta que venzas a la Enderdragón! 💪🐉
        </div>

    </div>

    <!-- INPUT -->
    <div class="input-area">
        <span class="prompt-prefix">&gt;</span>
        <input id="userInput" autocomplete="off" autofocus>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
let history = [
    { role: "assistant", content: "🧙 ¡Hola aventurero! Soy tu guía definitivo de Minecraft. Pregúntame sobre mobs, biomas, crafteos, o cuéntame cualquier situación que estés viviendo en el juego. ¡Te ayudaré paso a paso hasta que venzas a la Enderdragón! 💪🐉" } 
];

const messages = document.getElementById("messagesArea");
const input = document.getElementById("userInput");
const sonidoClic = new Audio("{{ url_for('static', filename='audio/click.ogg') }}");

function render() {
    messages.innerHTML = "";
    history.forEach(m => {
        const div = document.createElement("div");
        div.className = "message " + (m.role === "user" ? "user-message" : "assistant-message");
        
        const steveImgStr = `<img src="{{ url_for('static', filename='icons/steve.jpg') }}" class="chat-avatar">`;
        const robotImgStr = `<img src="{{ url_for('static', filename='icons/robot.jpg') }}" class="chat-avatar">`;
        
        const content = m.role === "assistant" ? marked.parse(m.content, { breaks: true }) : m.content;
        
        if (m.role === "user") {
            div.innerHTML = `<div>${content}</div> ${steveImgStr}`;
        } else {
            div.innerHTML = `${robotImgStr} <div>${content}</div>`;
        }

        messages.appendChild(div);
    });
    messages.scrollTop = messages.scrollHeight;
}

async function send() {
    const text = input.value.trim();
    if (!text) return;

    input.disabled = true;

    history.push({ role: "user", content: text });
    render();
    input.value = "";

    const botDiv = document.createElement("div");
    botDiv.className = "message assistant-message";
    botDiv.innerHTML = '<span style="color:#888;">Pensando...</span>';
    messages.appendChild(botDiv);
    messages.scrollTop = messages.scrollHeight;

    try {
        const res = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ messages: history })
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let botText = "";
        const robotImgStr = `<img src="{{ url_for('static', filename='icons/robot.jpg') }}" class="chat-avatar" style="border-color: #55ffff; margin-right: 10px;">`;
        while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            
            botText += decoder.decode(value, { stream: true });
            
            let safeText = botText
                .replace(/([a-zA-ZáéíóúÁÉÍÓÚñÑ0-9\.!?])\s*(###\s)/g, "$1\n\n$2")
                .replace(/([a-zA-ZáéíóúÁÉÍÓÚñÑ0-9\.!?])\s*(-\s)/g, "$1\n- ")


            
            botDiv.innerHTML = `${robotImgStr} <div>${marked.parse(safeText, { breaks: true })}</div>`;
            messages.scrollTop = messages.scrollHeight;
        }

        let finalSafeText = botText
            .replace(/([a-zA-ZáéíóúÁÉÍÓÚñÑ0-9\.!?])\s*(###\s)/g, "$1\n\n$2")
            .replace(/([a-zA-ZáéíóúÁÉÍÓÚñÑ0-9\.!?])\s*(-\s)/g, "$1\n- ")


            
        history.push({ role: "assistant", content: finalSafeText });

    } catch (e) {
        botDiv.innerHTML = "❌ Error de conexión.";
    }
    
    input.disabled = false;
    input.focus();
}


input.addEventListener("keypress", e => {
    if (e.key === "Enter") send();
});

document.querySelectorAll(".quick-btn").forEach(btn => {
    btn.onclick = () => {
        sonidoClic.play();
        input.value = btn.dataset.q;
        send();
    };
});

render();
</script>

</body>
</html>
