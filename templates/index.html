<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft For Dummies Bot</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Minecraftia', sans-serif;
    text-shadow: 2px 2px 0px #3f3f3f; /* Efecto de sombra de texto de MC */
}

body {
    background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                      url("{{ url_for('static', filename='image/background.jpg') }}");
    
    /* Ajustes para que la imagen cubra toda la pantalla */
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;

    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CONTAINER */
.chat-container {
    width: 100%;
    max-width: 950px;
    height: 85vh;
    background: #2b2b2b;
    border-radius: 0px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 4px solid #1e1e1e;
    box-shadow: 8px 8px 0px rgba(0,0,0,0.3);
}

/* HEADER */
.chat-header {
    position: relative; /* Crucial para alinear el robot independientemente del logo */
    background: #3b2a1f;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: center; /* Esto centra tu nueva imagen perfectamente */
    border: 4px solid;
    border-color: #7d7d7d #313131 #313131 #7d7d7d;
    min-height: 74px; /* Asegura que el contenedor no colapse si la imagen tarda en cargar */
}

.header-title-image {
    max-height: 40px; /* Ajusta este valor dependiendo de qué tan alto sea tu logo */
    image-rendering: pixelated; /* Mantiene los píxeles definidos si es pixel art */
    object-fit: contain;
}

.header-steve {
    width: 42px;
    height: 42px;
    object-fit: cover;
    image-rendering: pixelated;
    border-radius: 0px;
    
    position: absolute; /* Saca al robot del flujo normal del contenedor... */
    left: 18px; /* ...y lo fija pegado a la izquierda */
}


.icon {
    width: 26px;
    height: 26px;
    image-rendering: pixelated;
}

/* QUICK BUTTONS */
.quick-buttons {
    /* Le quitamos el fondo verde oscuro y usamos un gris oscuro neutro */
    background: #2b2b2b; 
    padding: 12px;
    display: flex;
    gap: 14px; /* Más espacio para que no choquen los contornos negros */
    flex-wrap: wrap;
    border-bottom: 4px solid #1e1e1e;
}

.quick-btn {
    background-color: #a8a8a8; /* El mítico gris de la piedra de interfaz */
    color: #ffffff;
    padding: 8px 14px;
    border-radius: 0px;
    cursor: pointer;
    font-size: 0.75rem;
    
    /* El secreto del 3D estilo Minecraft */
    border: 3px solid;
    /* Luz (blanco) arriba/izq, Sombra (gris oscuro) abajo/der */
    border-color: #ffffff #555555 #555555 #ffffff; 
    
    /* El borde negro exterior para darle aspecto de "bloque" */
    outline: 2px solid #000000;
    margin: 2px; /* Evita que el contorno negro se corte */
}

.quick-btn:hover {
    background-color: #a0a0a0; /* El fondo se oscurece un poco */
    color: #ffff55; /* ¡El clásico texto amarillo de Minecraft al seleccionar! */
}

.quick-btn:active {
    background-color: #8b8b8b;
    /* Invertimos el bisel para que parezca que el botón se "hunde" */
    border-color: #555555 #ffffff #ffffff #555555; 
}

/* CHAT AREA */
.messages-area {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    
    /* 1. Cambiamos el color sólido por una imagen */
    /* El gradiente rgba añade una capa de "suciedad" o sombra para que el texto sea legible */
    background-image:url("{{ url_for('static', filename='image/chat_bg.jpg') }}");
    
    background-size: cover;       /* Para que la imagen cubra todo el cuadro */
    background-position: center;  /* Centrada */
    background-repeat: no-repeat;
    
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-bottom: none;
}

/* MESSAGES */
.message {
    max-width: 100%;
    padding: 4px 8px;
    background-color: rgba(0, 0, 0, 0.7);
    border: none !important;
    box-shadow: none !important;
    font-size: 0.9rem;
    line-height: 1.6;
    color: #ffffff;
}


.user-message {
    align-self: flex-end;
}

.assistant-message {
    align-self: flex-start;
}

.assistant-message p {
    margin-bottom: 12px;
    line-height: 1.5;
}

.assistant-message p:last-child {
    margin-bottom: 0;
}

.assistant-message strong {
    font-weight: 700;
}

.assistant-message h3 {
    font-size: 1rem; 
    font-weight: 700;
    margin-top: 16px;
    margin-bottom: 8px;
}

.assistant-message ul, .assistant-message ol {
    margin-left: 24px;
    margin-bottom: 12px;
    margin-top: 4px;
}

.assistant-message li {
    margin-bottom: 6px;
    line-height: 1.4;
}

/* INPUT */
.input-area {
    display: flex;
    align-items: center;
    padding: 10px 18px;
    background-color: rgba(0, 0, 0, 0.7); /* Fondo transparente negro como los mensajes */
    gap: 10px;
}

.input-area input {
    flex: 1;
    background: transparent;
    color: #ffffff;
    border: none;
    outline: none; /* Quita el borde azul molesto al hacer clic */
    font-size: 0.9rem;
    /* La fuente Minecraftia y la sombra ya se heredan del selector global * */
}

.prompt-prefix {
    color: #ffffff;
    font-size: 1rem;
    font-weight: bold;
}

/* LOADING */
.loading-indicator {
    display: none;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 10px;
    color: white;
}

.spinner {
    width: 18px;
    height: 18px; /* Luz arriba/izquierda, sombra abajo/derecha */
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* STEVE FIX */
.header-steve {
    width: 42px;
    height: 42px;
    object-fit: cover;
    image-rendering: pixelated;
    border-radius: 0px;
    border: 2px solid;
    border-color: #55ffff;
}
/* AVATARES DE CHAT */
.chat-avatar {
    width: 32px;
    height: 32px;
    image-rendering: pixelated; /* ¡Crucial para el look de MC! */
    border: 2px solid;
    margin-bottom: -6px; /* Ajuste para alinear con el texto */
    transform: translateY(-3px);
}

.user-message .chat-avatar {
    margin-left: 10px;
    border: none;
}


.assistant-message .chat-avatar {
    margin-right: 10px;
    border: 2px solid #55ffff;
}

/* Ajuste de alineación para el contenedor del mensaje */
.message {
    display: flex;
    align-items: flex-start; /* Alinea los avatares arriba del texto largo */
    max-width: 90%; /* Un poco más ancho para dar espacio al avatar */
}

/* Asegura que el texto markdown no rompa la alineación */
.message div {
    flex: 1;
}
</style>
</head>

<body>

<div class="chat-container">

    <!-- HEADER -->
    <div class="chat-header">
        <img src="{{ url_for('static', filename='icons/robot.jpg') }}" class="header-steve">

        <!-- Imagen central: Asegúrate de tener tu logo en la carpeta indicada -->
        <img src="{{ url_for('static', filename='image/logo_titulo.png') }}" class="header-title-image" alt="Minecraft Logo">
    </div>

    <!-- QUICK PROMPTS -->
    <div class="quick-buttons">
        <button class="quick-btn" data-q="Guía desde el día 1 hasta la Enderdragón">📜 Guía completa</button>
        <button class="quick-btn" data-q="Cómo hacer pico de piedra y mesa de crafteo">🛠️ Crafteos</button>
        <button class="quick-btn" data-q="Estoy en el Nether sin fortaleza">🔥 Nether</button>
        <button class="quick-btn" data-q="Cómo matar enderman fácilmente">👾 Mobs</button>
        <button class="quick-btn" data-q="Dónde encontrar diamantes rápido">💎 Diamantes</button>
    </div>

    <!-- CHAT -->
    <div class="messages-area" id="messagesArea">

        <div class="message assistant-message">
            🧙 ¡Hola aventurero! Soy tu guía definitivo de Minecraft. Pregúntame sobre mobs, biomas, crafteos, o cuéntame cualquier situación que estés viviendo en el juego. ¡Te ayudaré paso a paso hasta que venzas a la Enderdragón! 💪🐉
        </div>

    </div>

    <!-- INPUT -->
    <div class="input-area">
        <span class="prompt-prefix">&gt;</span>
        <input id="userInput" autocomplete="off" autofocus>
    </div>

    <!-- LOADING -->
    <div class="loading-indicator" id="loading">
        <div class="spinner"></div>
        Analizando mundo...
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
let history = [
    { role: "assistant", content: "🧙 ¡Hola aventurero! Soy tu guía definitivo de Minecraft. Pregúntame sobre mobs, biomas, crafteos, o cuéntame cualquier situación que estés viviendo en el juego. ¡Te ayudaré paso a paso hasta que venzas a la Enderdragón! 💪🐉" } 
];

const messages = document.getElementById("messagesArea");
const input = document.getElementById("userInput");

// Renderiza el historial completo estático
// Renderiza el historial completo estático con avatares
function render() {
    messages.innerHTML = "";
    history.forEach(m => {
        const div = document.createElement("div");
        div.className = "message " + (m.role === "user" ? "user-message" : "assistant-message");
        
        // Rutas de los iconos (Asegúrate de que coincidan con las del header)
        const steveImgStr = `<img src="{{ url_for('static', filename='icons/steve.jpg') }}" class="chat-avatar" ">`;
        const robotImgStr = `<img src="{{ url_for('static', filename='icons/robot.jpg') }}" class="chat-avatar">`;
        
        const content = m.role === "assistant" ? marked.parse(m.content, { breaks: true }) : m.content;
        
        // Inyección de HTML: El avatar va antes o después según el rol
        if (m.role === "user") {
            div.innerHTML = `<div>${content}</div> ${steveImgStr}`;
        } else {
            div.innerHTML = `${robotImgStr} <div>${content}</div>`;
        }

        messages.appendChild(div);
    });
    messages.scrollTop = messages.scrollHeight;
}

async function send() {
    const text = input.value.trim();
    if (!text) return;

    // 1. Bloqueamos el input y el botón mientras la IA piensa (evita bugs de doble envío)
    input.disabled = true;

    // 2. Añadir y mostrar mensaje del usuario
    history.push({ role: "user", content: text });
    render();
    input.value = "";

    // 3. Crear burbuja vacía para el bot
    const botDiv = document.createElement("div");
    botDiv.className = "message assistant-message";
    botDiv.innerHTML = '<span style="color:#888;">Pensando...</span>';
    messages.appendChild(botDiv);
    messages.scrollTop = messages.scrollHeight;

    try {
        const res = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ messages: history })
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let botText = "";
        const robotImgStr = `<img src="{{ url_for('static', filename='icons/robot.jpg') }}" class="chat-avatar" style="border-color: #55ffff; margin-right: 10px;">`;
        // 4. Leer el flujo de datos (Stream)
        while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            
            botText += decoder.decode(value, { stream: true });
            
            // EL ESCUDO ANTI-MUROS DE TEXTO (Versión Mejorada)
            let safeText = botText
                .replace(/([a-zA-ZáéíóúÁÉÍÓÚñÑ0-9\.!?])\s*(###\s)/g, "$1\n\n$2")
                .replace(/([a-zA-ZáéíóúÁÉÍÓÚñÑ0-9\.!?])\s*(-\s)/g, "$1\n- ")


            
            botDiv.innerHTML = `${robotImgStr} <div>${marked.parse(safeText, { breaks: true })}</div>`;
            messages.scrollTop = messages.scrollHeight;
        }

        // 5. Guardar en el historial (¡USANDO EL MISMO FILTRO EXACTO!)
        let finalSafeText = botText
            .replace(/([a-zA-ZáéíóúÁÉÍÓÚñÑ0-9\.!?])\s*(###\s)/g, "$1\n\n$2")
            .replace(/([a-zA-ZáéíóúÁÉÍÓÚñÑ0-9\.!?])\s*(-\s)/g, "$1\n- ")


            
        history.push({ role: "assistant", content: finalSafeText });

    } catch (e) {
        botDiv.innerHTML = "❌ Error de conexión.";
    }
    
    // 6. Desbloqueamos el input para la siguiente pregunta
    input.disabled = false;
    input.focus();
}


input.addEventListener("keypress", e => {
    if (e.key === "Enter") send();
});

document.querySelectorAll(".quick-btn").forEach(btn => {
    btn.onclick = () => {
        input.value = btn.dataset.q;
        send();
    };
});

// Render inicial
render();
</script>

</body>
</html>
